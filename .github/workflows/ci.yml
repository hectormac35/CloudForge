name: CloudForge CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: cloudforge-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test .NET
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Display .NET information
        run: dotnet --info

      - name: Restore dependencies
        run: dotnet restore CloudForge.slnx

      - name: Build solution
        run: >
          dotnet build CloudForge.slnx
          --configuration Release
          --no-restore

      - name: Run tests
        run: >
          dotnet test CloudForge.slnx
          --configuration Release
          --no-build
          --verbosity normal

  docker-build:
    name: Build and validate Docker image
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build CloudForge API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: cloudforge-api:ci
          load: true

      - name: Start API container
        run: |
          docker run -d \
            --name cloudforge-api-ci \
            --publish 8081:8080 \
            cloudforge-api:ci

      - name: Wait for API health check
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://localhost:8081/health; then
              echo
              echo "CloudForge API is healthy."
              exit 0
            fi

            echo "Waiting for CloudForge API... attempt ${attempt}/20"
            sleep 3
          done

          echo "CloudForge API did not become healthy."
          docker logs cloudforge-api-ci
          exit 1

      - name: Show container logs
        if: always()
        run: docker logs cloudforge-api-ci || true

      - name: Remove test container
        if: always()
        run: docker rm -f cloudforge-api-ci || true
